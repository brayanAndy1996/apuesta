openapi: 3.1.0
info:
  title: Ruleta Rápida API
  version: "0.1.0"
  description: |
    Contrato HTTP entre `web/` y `api/`.
    La web genera sus tipos con `openapi-typescript` a partir de este archivo.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Estado del servicio y de la base de datos
      responses:
        "200":
          description: Servicio sano
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Servicio degradado (sin base de datos)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/login:
    post:
      operationId: loginAdmin
      summary: Login del administrador (usuario + contraseña)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Login correcto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400": { description: Datos inválidos }
        "401": { description: Credenciales inválidas }
  /auth/pin:
    post:
      operationId: loginCashier
      summary: Login del cajero (usuario + PIN de 4 a 6 dígitos)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, pin]
              properties:
                username: { type: string }
                pin:
                  type: string
                  pattern: '^\\d{4,6}$'
      responses:
        "200":
          description: Login correcto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400": { description: Datos inválidos }
        "401": { description: Credenciales inválidas }
  /auth/me:
    get:
      operationId: getMe
      summary: Usuario del token actual
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401": { description: Token ausente o inválido }
  /admin/cashiers:
    post:
      operationId: createCashier
      summary: Crear cajero (solo admin). Devuelve el username autogenerado.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, pin]
              properties:
                name: { type: string }
                pin:
                  type: string
                  pattern: '^\\d{4,6}$'
      responses:
        "201":
          description: Cajero creado
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400": { description: Datos inválidos }
        "401": { description: Sin token }
        "403": { description: No es admin }
    get:
      operationId: listCashiers
      summary: Listar cajeros (solo admin)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista de cajeros
          content:
            application/json:
              schema:
                type: object
                required: [cashiers]
                properties:
                  cashiers:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401": { description: Sin token }
        "403": { description: No es admin }
  /admin/cashiers/{id}:
    patch:
      operationId: updateCashier
      summary: Actualizar cajero — desactivar, cambiar PIN o nombre (solo admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                pin:
                  type: string
                  pattern: '^\\d{4,6}$'
                active: { type: boolean }
      responses:
        "200":
          description: Cajero actualizado
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400": { description: Datos inválidos }
        "401": { description: Sin token }
        "403": { description: No es admin }
        "404": { description: Cajero no encontrado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        db:
          type: string
          enum: [up, down]
    User:
      type: object
      required: [id, role, username, name, active]
      properties:
        id: { type: string, format: uuid }
        role:
          type: string
          enum: [admin, cashier]
        username: { type: string }
        name: { type: string }
        active: { type: boolean }
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/User"
