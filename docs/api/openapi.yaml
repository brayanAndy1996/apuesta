openapi: 3.1.0
info:
  title: Ruleta Rápida API
  version: "0.1.0"
  description: |
    Contrato HTTP entre `web/` y `api/`.
    La web genera sus tipos con `openapi-typescript` a partir de este archivo.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Estado del servicio y de la base de datos
      responses:
        "200":
          description: Servicio sano
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Servicio degradado (sin base de datos)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/login:
    post:
      operationId: loginAdmin
      summary: Login del administrador (usuario + contraseña)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Login correcto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400": { description: Datos inválidos }
        "401": { description: Credenciales inválidas }
  /auth/pin:
    post:
      operationId: loginCashier
      summary: Login del cajero (usuario + PIN de 4 a 6 dígitos)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, pin]
              properties:
                username: { type: string }
                pin:
                  type: string
                  pattern: '^\\d{4,6}$'
      responses:
        "200":
          description: Login correcto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400": { description: Datos inválidos }
        "401": { description: Credenciales inválidas }
  /auth/me:
    get:
      operationId: getMe
      summary: Usuario del token actual
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401": { description: Token ausente o inválido }
  /admin/cashiers:
    post:
      operationId: createCashier
      summary: Crear cajero (solo admin). Devuelve el username autogenerado.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, pin]
              properties:
                name: { type: string }
                pin:
                  type: string
                  pattern: '^\\d{4,6}$'
      responses:
        "201":
          description: Cajero creado
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400": { description: Datos inválidos }
        "401": { description: Sin token }
        "403": { description: No es admin }
    get:
      operationId: listCashiers
      summary: Listar cajeros (solo admin)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista de cajeros
          content:
            application/json:
              schema:
                type: object
                required: [cashiers]
                properties:
                  cashiers:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401": { description: Sin token }
        "403": { description: No es admin }
  /admin/cashiers/{id}:
    patch:
      operationId: updateCashier
      summary: Actualizar cajero — desactivar, cambiar PIN o nombre (solo admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                pin:
                  type: string
                  pattern: '^\\d{4,6}$'
                active: { type: boolean }
      responses:
        "200":
          description: Cajero actualizado
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400": { description: Datos inválidos }
        "401": { description: Sin token }
        "403": { description: No es admin }
        "404": { description: Cajero no encontrado }
  /rooms:
    get:
      operationId: listPublicRooms
      summary: Salas activas (público)
      responses:
        "200":
          description: Lista de salas activas
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms:
                    type: array
                    items: { $ref: "#/components/schemas/Room" }
  /rooms/{code}:
    get:
      operationId: getPublicRoom
      summary: Detalle público de una sala por código
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Sala con sus casillas
          content:
            application/json:
              schema:
                type: object
                required: [room]
                properties:
                  room: { $ref: "#/components/schemas/Room" }
        "404": { description: Sala no encontrada o inactiva }
  /rooms/{code}/round:
    get:
      operationId: getCurrentRound
      summary: Ronda actual de una sala (pública)
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Ronda abierta (o la última no liquidada)
          content:
            application/json:
              schema:
                type: object
                required: [round]
                properties:
                  round: { $ref: "#/components/schemas/RoundView" }
        "404": { description: Sala no encontrada o inactiva }
  /rooms/{code}/bets:
    post:
      operationId: placeBet
      summary: Registrar apuesta en la bolsa (provisional hasta la spec 007)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [side, amountCentimos]
              properties:
                side: { type: string, enum: [red, blue] }
                amountCentimos: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Apuesta registrada
          content:
            application/json:
              schema:
                type: object
                required: [bet, round]
                properties:
                  bet:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      seq: { type: integer }
                      side: { type: string, enum: [red, blue] }
                      amountCentimos: { type: integer }
                      status: { type: string, enum: [QUEUED, POOL] }
                  round:
                    type: object
                    properties:
                      seq: { type: integer }
                      state: { type: string }
        "400": { description: Datos inválidos }
        "401": { description: Sin token }
        "403": { description: Cajero no asignado a la sala ni admin }
        "404": { description: Sala no encontrada o inactiva }
        "422": { description: Monto fuera del rango de la sala }
  /admin/rooms:
    get:
      operationId: listRooms
      summary: Todas las salas (solo admin)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista de salas
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms:
                    type: array
                    items: { $ref: "#/components/schemas/Room" }
        "401": { description: Sin token }
        "403": { description: No es admin }
    post:
      operationId: createRoom
      summary: Crear sala (solo admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                whatsappNumber: { type: string, nullable: true }
                minBetCentimos: { type: integer, minimum: 0 }
                maxBetCentimos: { type: integer, minimum: 0 }
                cashierId: { type: string, format: uuid, nullable: true }
                slots:
                  type: array
                  items: { $ref: "#/components/schemas/RoomSlotInput" }
      responses:
        "201":
          description: Sala creada
          content:
            application/json:
              schema:
                type: object
                required: [room]
                properties:
                  room: { $ref: "#/components/schemas/Room" }
        "400": { description: Datos inválidos }
        "409": { description: El cajero ya atiende otra sala }
  /admin/rooms/{id}:
    get:
      operationId: getRoom
      summary: Detalle de sala con casillas (solo admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sala
          content:
            application/json:
              schema:
                type: object
                required: [room]
                properties:
                  room: { $ref: "#/components/schemas/Room" }
        "404": { description: Sala no encontrada }
    patch:
      operationId: updateRoom
      summary: Editar sala (solo admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                whatsappNumber: { type: string, nullable: true }
                minBetCentimos: { type: integer, minimum: 0 }
                maxBetCentimos: { type: integer, minimum: 0 }
                cashierId: { type: string, format: uuid, nullable: true }
                active: { type: boolean }
      responses:
        "200":
          description: Sala actualizada
          content:
            application/json:
              schema:
                type: object
                required: [room]
                properties:
                  room: { $ref: "#/components/schemas/Room" }
        "400": { description: Datos inválidos }
        "409": { description: El cajero ya atiende otra sala }
  /admin/rooms/{id}/slots:
    put:
      operationId: replaceSlots
      summary: Reemplazar las casillas de la sala en bloque (solo admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots:
                  type: array
                  minItems: 2
                  items: { $ref: "#/components/schemas/RoomSlotInput" }
      responses:
        "200":
          description: Casillas reemplazadas
          content:
            application/json:
              schema:
                type: object
                required: [slots]
                properties:
                  slots:
                    type: array
                    items: { $ref: "#/components/schemas/RoomSlot" }
        "400": { description: Casillas inválidas }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Health:
      type: object
      required: [status, db]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        db:
          type: string
          enum: [up, down]
    User:
      type: object
      required: [id, role, username, name, active]
      properties:
        id: { type: string, format: uuid }
        role:
          type: string
          enum: [admin, cashier]
        username: { type: string }
        name: { type: string }
        active: { type: boolean }
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/User"
    RoomSlotInput:
      type: object
      required: [side, multiplier, weight]
      properties:
        side:
          type: string
          enum: [red, blue]
        multiplier:
          type: integer
          minimum: 101
          maximum: 199
          description: Multiplicador ×100 (150 = 1.5)
        weight:
          type: integer
          minimum: 1
          maximum: 99
    RoomSlot:
      allOf:
        - $ref: "#/components/schemas/RoomSlotInput"
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    Room:
      type: object
      required: [id, code, name, minBetCentimos, maxBetCentimos, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        whatsappNumber: { type: string, nullable: true }
        minBetCentimos: { type: integer }
        maxBetCentimos: { type: integer }
        active: { type: boolean }
        cashier:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        slots:
          type: array
          items: { $ref: "#/components/schemas/RoomSlot" }
    RoundView:
      type: object
      required: [seq, state, pools, queued, seedHash]
      properties:
        seq: { type: integer }
        state:
          type: string
          enum: [ESPERANDO, CUENTA_REGRESIVA, PAUSADA, CERRADA, GIRANDO, LIQUIDADA]
        pools:
          type: object
          properties:
            red: { type: integer }
            blue: { type: integer }
        queued:
          type: object
          properties:
            red: { type: integer }
            blue: { type: integer }
        missing:
          type: object
          description: Cuánto falta del otro color para que entre el frente de la cola
          properties:
            red:
              oneOf:
                - type: object
                  properties:
                    min: { type: integer, nullable: true }
                    max: { type: integer, nullable: true }
                - type: "null"
            blue:
              oneOf:
                - type: object
                  properties:
                    min: { type: integer, nullable: true }
                    max: { type: integer, nullable: true }
                - type: "null"
        countdownEndsAt: { type: string, format: date-time, nullable: true }
        maxEndsAt: { type: string, format: date-time, nullable: true }
        girandoEndsAt: { type: string, format: date-time, nullable: true }
        seedHash: { type: string, description: SHA-256 de la semilla, publicado antes del sorteo }
        resultSlotId: { type: string, format: uuid, nullable: true }
