name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: apuesta
          POSTGRES_PASSWORD: apuesta
          POSTGRES_DB: apuesta
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apuesta -d apuesta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://apuesta:apuesta@localhost:5432/apuesta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: api — install, lint, migrate, test
        working-directory: api
        run: |
          npm ci
          npm run lint
          npm run db:migrate
          npm test
      - name: web — install, lint, build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build
